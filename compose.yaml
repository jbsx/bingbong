# Bing Bong kiosk deployment (ADR 0023).
#
#   cp .env.example config/.env   # fill model routing + keys
#   scripts/kiosk-setup.sh        # diagnose-only preflight
#   docker compose up --build -d
#
# Host contract: Linux kiosk, single user UID 1000, X11 session, PipeWire
# (pipewire-pulse) — see scripts/kiosk-setup.sh for the checks. Durable state
# is one bind mount: ./data (HOME=/data inside). Fresh start = delete ./data;
# migration = copy it.

name: bingbong

services:
  bingbong:
    build: .
    image: bingbong-kiosk
    user: 1000:1000
    init: true
    restart: unless-stopped
    shm_size: 1g
    environment:
      # Durable state + downloads live under /data.
      HOME: /data
      BINGBONG_USER_DATA_DIR: /data/.config/bingbong
      # X11 passthrough: draw real windows on the kiosk's screen (the
      # On-Screen Principle holds literally — no VNC mirror). X access is
      # granted host-side (xhost +local:, checked by kiosk-setup.sh).
      DISPLAY: ${DISPLAY:?set DISPLAY on the host (run inside your X session)}
      # PulseAudio unix-socket passthrough; ownership checks pass because the
      # container user matches the socket's host UID (1000).
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./data:/data
      # The Env File stays next to the app and read-only: layering semantics
      # (.env < process env < Settings) are preserved literally.
      - ./config/.env:/app/.env:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
    devices:
      # GPU with the crash-loop guard as fallback (boots software-rendered if
      # the driver loops). Drop these two lines on a headless-GPU box.
      - /dev/dri:/dev/dri
    group_add:
      - video

  # The Log Bucket (#418): copies ./data's logs to the owner's R2 bucket every
  # 5 minutes so they outlive the app's 7-day purge. Settings are the
  # BINGBONG_LOG_* and RCLONE_CONFIG_R2_* lines of config/.env, read by the
  # script itself: no env_file, so the model keys never enter this
  # container. Unconfigured, it logs one line and sleeps.
  log-bucket:
    image: rclone/rclone:1.74.4
    user: 1000:1000
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/log-bucket.sh", "run"]
    environment:
      BINGBONG_LOG_MACHINE: kiosk
      # The token is scoped to the one bucket: without this, every upload
      # first tries CreateBucket and is refused.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      # No rclone config file: the remote is the RCLONE_CONFIG_R2_* lines.
      # Empty, rclone stops logging "config file not found" on every run.
      RCLONE_CONFIG: ""
      # rclone's cache dir; nothing in it outlives a restart.
      HOME: /tmp
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Never created by docker: a missing source would be made root-owned
      # and the app could not write its profile. kiosk-setup.sh creates it.
      - type: bind
        source: ./data/.config/bingbong/logs
        target: /logs
        read_only: true
        bind:
          create_host_path: false
      - ./config/.env:/config/.env:ro
      - ./docker/log-bucket.sh:/log-bucket.sh:ro
