<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grading Bench</title>
<link rel="icon" href="data:,">
<!--
  The Grading Bench page (#228, #232), served by scripts/live-review.ts on
  loopback once the setup page's Start has opened a bench (#229).
  Plain DOM, no framework, no network beyond its own server. Every string
  from a capture, a key or a Grade goes in through textContent; the one
  exception is the Answer, which the server rendered with the app's
  react-markdown (raw HTML escaped, unsafe URLs dropped). Links from a
  capture are only ever http(s) and open in a new tab.

  One slot is two panes (#232): what to read on the left, in three tabs —
  the Answer, what the assistant read, the key — and the Grade form on the
  right, in the order a reviewer works: constraints, checks, verdict,
  support, rationale, with the save bar pinned under it. What each part
  means is in docs/live-web-reporting.md; the page carries labels, not
  lessons.

  The page never picks a verdict and never shows another reviewer's Grade
  before this reviewer's own is saved: the server does not send it.
-->
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e6e6e0; --line-strong: #d3d3cb;
    --accent: #2f5bd3; --ok: #1f7a3a; --warn: #9a6200; --bad: #b3261e; --soft: #eef1fb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecece8; --muted: #9c9c95; --line: #2e2e2a; --line-strong: #43433d;
      --accent: #8aa8ff; --ok: #6fcf8a; --warn: #e6b450; --bad: #ff8a80; --soft: #232a3d; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  a { color: var(--accent); overflow-wrap: anywhere; }
  button { font: inherit; color: inherit; cursor: pointer; }
  code, pre { font-family: var(--mono); font-size: 12.5px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; border-radius: 6px; max-height: 420px; overflow: auto; margin: 6px 0; }
  h1 { font-size: 15px; margin: 0; }
  h2 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 12px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  h4 { font-size: 13px; margin: 12px 0 4px; }
  ul, ol { padding-left: 20px; margin: 4px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .error { color: var(--bad); }

  /* The frame: header, slot list, one slot. */
  .top { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top #change-set { margin-left: auto; }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
  nav { border-right: 1px solid var(--line); padding: 12px 8px; background: var(--panel); }
  .hunts, .hunts ol { list-style: none; padding: 0; margin: 0; }
  .hunt + .hunt { margin-top: 12px; }
  .hunt-name { font-size: 12.5px; font-weight: 600; padding: 0 8px 2px; overflow-wrap: anywhere; }
  .hunt a { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 6px; text-decoration: none; color: inherit; font-size: 13px; }
  .hunt a:hover { background: var(--soft); }
  .hunt li.active a { background: var(--soft); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .dot-graded { background: var(--ok); border-color: var(--ok); }
  .dot-drafted { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
  .dot-not_reached { border-style: dashed; }
  .state { font-size: 12px; color: var(--muted); font-weight: 400; }
  .state-graded { color: var(--ok); }
  .state-drafted { color: var(--warn); }
  #progress { margin: 14px 8px 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  main { padding: 0 16px 16px; min-width: 0; }
  .attempt-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 12px 2px 10px; }
  .chip { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line-strong); white-space: nowrap; color: var(--muted); }
  .chip-graded, .chip-loaded, .chip-recorded { color: var(--ok); border-color: currentColor; }
  .chip-drafted, .chip-walled { color: var(--warn); border-color: currentColor; }
  .chip-errored, .chip-rejected { color: var(--bad); border-color: currentColor; }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; display: flex; flex-direction: column; }
  .pane-scroll { padding: 4px 18px 18px; min-height: 0; }
  @media (min-width: 1100px) {
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .layout { flex: 1; min-height: 0; }
    nav { overflow: auto; }
    main { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
    .panes { flex: 1; min-height: 0; }
    .pane { min-height: 0; }
    .pane-scroll { overflow: auto; flex: 1; }
  }
  @media (max-width: 1100px) {
    .panes { grid-template-columns: minmax(0, 1fr); }
    .tabbar { position: sticky; top: 0; z-index: 1; }
    .save-bar { position: sticky; bottom: 0; }
  }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } nav { border-right: 0; border-bottom: 1px solid var(--line); } }

  /* The reading pane. */
  .tabbar { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--line); background: var(--panel); border-radius: 10px 10px 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; }
  [role="tab"] { border: 0; background: none; padding: 10px 10px 8px; border-bottom: 2px solid transparent; color: var(--muted); }
  [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-count { font-weight: 400; }
  .tab-marker { color: var(--warn); font-weight: 400; }
  .view-toggle { margin-left: auto; display: flex; }
  .view-toggle button { font-size: 12px; padding: 1px 9px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted); }
  .view-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .view-toggle button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .view-toggle button[aria-pressed="true"] { background: var(--soft); color: var(--accent); }
  .feed-markdown { line-height: 1.6; }
  .feed-markdown pre { max-height: none; }
  .answer { margin-top: 14px; }
  details.fold { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  details.fold > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .empty-state { margin: 16px 0; }
  .reads, .evidence { list-style: none; padding: 0; margin: 8px 0; }
  .read { border-top: 1px solid var(--line); }
  .read:first-child { border-top: 0; }
  .read-line { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; min-width: 0; }
  summary.read-line { cursor: pointer; list-style: none; }
  summary.read-line::-webkit-details-marker { display: none; }
  summary.read-line::before { content: '▸'; color: var(--muted); font-size: 11px; }
  details[open] > summary.read-line::before { content: '▾'; }
  .read-line .tool { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .read-url, .read-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .read-url { flex: 0 1 auto; max-width: 55%; }
  .read-title { flex: 1 1 0; font-size: 12.5px; }
  .read-detail { padding: 0 0 8px 18px; }
  .evidence > li { padding: 8px 0; border-top: 1px solid var(--line); }
  .evidence > li:first-child { border-top: 0; }
  .evidence-head { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--line-strong); color: var(--muted); }

  /* The Grade form. */
  .constraints { margin: 14px 0 0; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--bg); border-radius: 0 6px 6px 0; }
  .constraints h3 { margin: 0 0 4px; color: var(--warn); }
  .constraints ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .section-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 22px 0 8px; }
  .section-head h3 { margin: 0; }
  .checks { list-style: none; padding: 0; margin: 0; }
  .check { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .check-text { flex: 1 1 240px; min-width: 0; }
  .check-id { font-size: 11px; color: var(--muted); margin-right: 4px; }
  .check-controls { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .seg-group { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .seg { border: 0; background: var(--panel); padding: 2px 10px; font-size: 12.5px; color: var(--muted); }
  .seg + .seg { border-left: 1px solid var(--line-strong); }
  .seg-yes[aria-pressed="true"] { background: color-mix(in srgb, var(--ok) 16%, var(--panel)); color: var(--ok); font-weight: 600; }
  .seg-no[aria-pressed="true"] { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); color: var(--bad); font-weight: 600; }
  .note-toggle { border: 1px solid transparent; background: none; border-radius: 6px; padding: 0 6px; color: var(--muted); }
  .note-toggle:hover, .note-toggle[aria-expanded="true"] { border-color: var(--line-strong); }
  .note-toggle.has-note { color: var(--accent); }
  .note-box { flex-basis: 100%; }
  .verdicts { display: grid; gap: 2px; }
  .verdict { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .verdict:has(input:checked) { background: var(--soft); }
  .verdict-gloss { margin-left: 6px; }
  textarea, input[type="text"], select { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: inherit; }
  textarea { resize: vertical; }
  .support-row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px dashed var(--line-strong); }
  .support-row .supports { font-size: 12.5px; }
  button.quiet { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 2px 10px; font-size: 12.5px; }

  /* The save bar, pinned under the form. */
  .save-bar { border-top: 1px solid var(--line); padding: 10px 18px; background: var(--panel); border-radius: 0 0 10px 10px; }
  .save-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .save-status { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; flex: 1 1 220px; min-width: 0; }
  .to-save-line { font-size: 13px; }
  .to-save-line .ready { color: var(--ok); font-weight: 600; }
  .save-state { font-size: 12px; color: var(--muted); }
  .save-buttons { display: flex; gap: 8px; }
  .save-buttons button { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 7px; padding: 6px 14px; }
  .save-buttons button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .save-buttons button:disabled { opacity: .45; cursor: not-allowed; }
  .to-save { list-style: none; padding: 0; margin: 0 0 8px; font-size: 13px; }
  .to-save .mark { display: inline-block; width: 1.2em; color: var(--muted); }
  .to-save .done { color: var(--muted); }
  .to-save .done .mark { color: var(--ok); }
  .save-errors { margin: 0 0 8px; padding-left: 18px; color: var(--bad); font-size: 13px; }

  /* Another reviewer's Grade, after save. */
  .comparison { margin-top: 26px; padding-top: 2px; border-top: 2px solid var(--line); }
  .comparison-summary { margin: 0 0 4px; }
  .pair { padding: 8px 0; border-top: 1px solid var(--line); }
  .pair-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 4px; }
  .who { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #show-agreements { margin-top: 8px; }
</style>
</head>
<body>
<header class="top">
  <h1>Grading Bench</h1>
  <span id="set-id"></span>
  <span id="slot-position" class="muted"></span>
  <span id="reviewer" class="muted"></span>
  <a href="/" id="change-set" title="Back to the setup page — your drafts are kept, and this process stays open">change set</a>
</header>
<div class="layout">
  <nav aria-label="slots">
    <ol class="hunts" id="slots"></ol>
    <p id="progress"></p>
  </nav>
  <main id="main"><p class="muted">Loading the capture set…</p></main>
</div>
<script>
'use strict'

// ---------------------------------------------------------------------------
// Small DOM helpers. Text always goes in as text.

function el(tag, attrs, ...children) {
  const node = document.createElement(tag)
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue
    if (name === 'class') node.className = value
    else if (name === 'text') node.textContent = value
    else if (name.startsWith('on')) node.addEventListener(name.slice(2), value)
    else if (value === true) node.setAttribute(name, '')
    else node.setAttribute(name, String(value))
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue
    node.append(typeof child === 'string' ? document.createTextNode(child) : child)
  }
  return node
}

/** A link only for http(s) — a URL from a captured page is untrusted. */
function link(url, label) {
  if (typeof url !== 'string' || url === '') return null
  if (!/^https?:\/\//i.test(url)) return el('span', { class: 'muted', text: label || url })
  return el('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: label || url })
}

/** A link that names only a page's host and path, with the whole URL on hover. */
function shortLink(url, className) {
  if (typeof url !== 'string' || url === '') return null
  let label = url
  try {
    const parsed = new URL(url)
    label = `${parsed.host}${parsed.pathname === '/' ? '' : parsed.pathname}${parsed.search}`
  } catch {
    // Not a URL: shown as it is.
  }
  const node = link(url, label)
  node.className = [node.className, className].filter(Boolean).join(' ')
  node.title = url
  return node
}

function list(items) {
  return el('ul', {}, items.map((item) => el('li', { text: item })))
}

function listOrNone(items) {
  return items && items.length > 0 ? list(items) : el('p', { class: 'muted small', text: 'None.' })
}

async function api(method, path, body, extra) {
  const init = Object.assign({ method, headers: {} }, extra || {})
  // Sets switch in one process: a bench since opened on another set refuses this page rather than serve it.
  if (benchSet !== null) init.headers['x-grading-set'] = benchSet
  if (body !== undefined) {
    init.headers['content-type'] = 'application/json'
    init.body = JSON.stringify(body)
  }
  const response = await fetch(path, init)
  let data = null
  try {
    data = await response.json()
  } catch (error) {
    data = { error: `the server sent no JSON (${String(error)})` }
  }
  return { status: response.status, data }
}

const STATUS_TEXT = {
  pass: ['pass', 'the expected outcome, independently verified'],
  useful_partial: ['useful partial', 'real verified work, short of the outcome'],
  help_access_blocked: ['help / access blocked', 'hit an access wall, or needed help it did not get'],
  unsuccessful: ['unsuccessful', 'no useful result or next step'],
}

const WALL_TEXT = { challenge: 'challenge-walled', 'network-block': 'network-blocked', 'login-wall': 'login-walled' }

// ---------------------------------------------------------------------------
// State

let setView = null
/** The set this page was opened on, named on every request once known. */
let benchSet = null
/** The attempt on screen: the server's view, the editable state, the draft bookkeeping, and the save bar's parts. */
let current = null

function freshCurrent(view) {
  const state = view.editor ? JSON.parse(JSON.stringify(view.editor.state)) : null
  const picks = view.key.pickSources
  // Every slot opens on the Answer; re-drawing the same slot (a save, a discard) keeps the tab.
  const tab = current && current.attemptId === view.slot.attemptId ? current.tab : 'answer'
  return {
    attemptId: view.slot.attemptId,
    view,
    state,
    tab,
    source: view.editor ? view.editor.source : null,
    toSave: view.toSave,
    supportModes: state ? state.support.map((row) => (row.sourceUrl === '' || picks.some((pick) => pick.url === row.sourceUrl) ? 'pick' : 'other')) : [],
    timer: null,
    dirty: false,
    inflight: Promise.resolve(),
    ui: null,
  }
}

// ---------------------------------------------------------------------------
// The set: header and slot list

async function refreshSet() {
  const { status, data } = await api('GET', '/api/set')
  if (status !== 200) {
    document.getElementById('main').replaceChildren(el('p', { class: 'error', text: data.error || `the set could not be loaded (HTTP ${status})` }))
    return false
  }
  setView = data
  benchSet = data.setId
  document.getElementById('set-id').textContent = data.setId
  document.getElementById('reviewer').replaceChildren('as ', el('strong', { text: data.reviewer }))
  renderSidebar()
  return true
}

function stepName(slot) {
  return slot.relation === 'initial' ? 'initial' : 'follow-up'
}

function slotLabel(slot) {
  if (slot.state === 'not_reached') return 'not reached'
  if (slot.state === 'graded') return slot.unsavedDraft ? `${STATUS_TEXT[slot.status][0]} · edited` : STATUS_TEXT[slot.status][0]
  return slot.state
}

function renderSidebar() {
  if (!setView) return
  const slots = setView.slots
  // Grouped by hunt, in schedule order: a follow-up sits under its hunt rather than indented beside it.
  const hunts = []
  for (const slot of slots) {
    let hunt = hunts.find((candidate) => candidate.huntId === slot.huntId)
    if (!hunt) {
      hunt = { huntId: slot.huntId, slots: [] }
      hunts.push(hunt)
    }
    hunt.slots.push(slot)
  }
  document.getElementById('slots').replaceChildren(
    ...hunts.map((hunt) =>
      el(
        'li',
        { class: 'hunt' },
        el('div', { class: 'hunt-name', text: hunt.huntId }),
        el(
          'ol',
          {},
          hunt.slots.map((slot) =>
            el(
              'li',
              { class: current && current.attemptId === slot.attemptId ? 'active' : '' },
              el(
                'a',
                { href: `#${encodeURIComponent(slot.attemptId)}`, title: slot.reason || slot.attemptId },
                el('span', { class: `dot dot-${slot.state}`, 'aria-hidden': 'true' }),
                el('span', { text: stepName(slot) }),
                el('span', { class: `state state-${slot.state}`, text: slotLabel(slot) }),
              ),
            ),
          ),
        ),
      ),
    ),
  )
  const count = (state) => slots.filter((slot) => slot.state === state).length
  const notReached = count('not_reached')
  const parts = [`${count('graded')} of ${slots.length - notReached} saved`]
  if (count('drafted') > 0) parts.push(`${count('drafted')} drafted`)
  if (notReached > 0) parts.push(`${notReached} not reached`)
  document.getElementById('progress').textContent = parts.join(' · ')
  const index = current ? slots.findIndex((slot) => slot.attemptId === current.attemptId) : -1
  document.getElementById('slot-position').textContent = index === -1 ? '' : `slot ${index + 1} of ${slots.length}`
}

// ---------------------------------------------------------------------------
// One attempt

async function openFromHash() {
  const wanted = decodeURIComponent(location.hash.slice(1))
  if (!wanted) {
    const first = setView.slots.find((slot) => slot.state === 'pending' || slot.state === 'drafted') || setView.slots[0]
    if (first) location.replace(`#${encodeURIComponent(first.attemptId)}`)
    return
  }
  await flushDraft()
  const { status, data } = await api('GET', `/api/attempt/${encodeURIComponent(wanted)}`)
  if (status !== 200) {
    current = null
    document.getElementById('main').replaceChildren(el('p', { class: 'error', text: data.error || `HTTP ${status}` }))
    renderSidebar()
    return
  }
  renderAttempt(data)
}

function renderAttempt(view, saveNote) {
  current = freshCurrent(view)
  const slot = view.slot
  const head = el(
    'div',
    { class: 'attempt-head' },
    el('h2', { text: slot.huntId, title: slot.attemptId }),
    el('span', { class: 'muted', text: stepName(slot) }),
    el('span', { class: `chip chip-${slot.state}`, text: slotLabel(slot) }),
  )
  const grade = gradePane(view, saveNote)
  document.getElementById('main').replaceChildren(head, el('div', { class: 'panes' }, readingPane(view), grade))
  // Drawn once the bar is in the document, from the view the server sent.
  drawToSave()
  renderSidebar()
  if (saveNote && view.comparison) {
    const comparison = document.getElementById('comparison')
    if (comparison) comparison.scrollIntoView({ block: 'nearest' })
  }
}

// ---------------------------------------------------------------------------
// The reading pane: Answer, What it read, Key

function readingPane(view) {
  const panels = { answer: answerPanel(view), read: readPanel(view), key: keyPanel(view) }
  const tabs = [
    ['answer', ['Answer']],
    ['read', readLabel(view)],
    ['key', ['Key']],
  ]
  const buttons = tabs.map(([id, label]) => el('button', { type: 'button', role: 'tab', 'data-tab': id, 'aria-selected': 'false', onclick: () => select(id) }, label))
  const toggle = view.answer || (view.parent && view.parent.answer) ? viewToggle(panels.answer) : null
  const select = (id) => {
    current.tab = id
    for (const button of buttons) button.setAttribute('aria-selected', String(button.dataset.tab === id))
    for (const [panelId, panel] of Object.entries(panels)) panel.hidden = panelId !== id
    if (toggle) toggle.hidden = id !== 'answer'
  }
  const pane = el(
    'section',
    { class: 'pane reading-pane' },
    el('div', { class: 'tabbar' }, el('div', { class: 'tabs', role: 'tablist', 'aria-label': 'what to read' }, buttons), toggle),
    el('div', { class: 'pane-scroll' }, Object.values(panels)),
  )
  select(current.tab)
  return pane
}

/** "What it read · 8 · 1 walled": the number of reads, and a marker when any hit a wall or an error. */
function readLabel(view) {
  if (!view.trail) return ['What it read']
  const steps = view.trail.steps
  const count = (test) => steps.filter(test).length
  const markers = [
    [count((step) => step.outcome === 'walled' && step.wall.signal !== 'network-block'), 'walled'],
    [count((step) => step.outcome === 'walled' && step.wall.signal === 'network-block'), 'blocked'],
    [count((step) => step.outcome === 'errored'), 'errored'],
  ].filter(([n]) => n > 0)
  return ['What it read', el('span', { class: 'tab-count', text: ` · ${steps.length}` }), markers.map(([n, word]) => el('span', { class: 'tab-marker', text: ` · ${n} ${word}` }))]
}

/** The rendered/raw switch for every Answer in the Answer tab. */
function viewToggle(panel) {
  const rendered = el('button', { type: 'button', 'aria-pressed': 'true', text: 'rendered' })
  const raw = el('button', { type: 'button', 'aria-pressed': 'false', text: 'raw' })
  const show = (asRaw) => {
    for (const node of panel.querySelectorAll('.answer-rendered')) node.hidden = asRaw
    for (const node of panel.querySelectorAll('.answer-raw')) node.hidden = !asRaw
    rendered.setAttribute('aria-pressed', String(!asRaw))
    raw.setAttribute('aria-pressed', String(asRaw))
  }
  rendered.addEventListener('click', () => show(false))
  raw.addEventListener('click', () => show(true))
  return el('div', { class: 'view-toggle', role: 'group', 'aria-label': 'how the Answer is shown' }, rendered, raw)
}

function answerBody(answer) {
  const rendered = el('div', { class: 'feed-markdown answer-rendered' })
  rendered.innerHTML = answer.html // rendered server-side by react-markdown: raw HTML escaped, unsafe URLs dropped
  return [rendered, el('pre', { class: 'answer-raw', text: answer.text, hidden: true })]
}

function answerPanel(view) {
  const parts = []
  if (view.parent) {
    parts.push(
      view.parent.answer
        ? el('details', { class: 'fold' }, el('summary', { text: 'The initial’s Answer' }), answerBody(view.parent.answer))
        : el('p', { class: 'muted small', text: `The initial (${view.parent.attemptId}) published no Answer.` }),
    )
  }
  if (view.command) parts.push(el('details', { class: 'fold' }, el('summary', { text: 'The command as submitted' }), el('pre', { text: view.command })))
  if (view.answer) parts.push(el('div', { class: 'answer' }, answerBody(view.answer)))
  else if (view.slot.state === 'not_reached') parts.push(el('div', { class: 'empty-state' }, el('strong', { text: 'Not reached. ' }), view.slot.reason, el('p', { class: 'muted', text: 'Nothing was dispatched, so there is no Answer to grade; the slot stays pending and the report carries its reason.' })))
  else parts.push(el('div', { class: 'empty-state' }, el('strong', { text: 'No Answer was published. ' }), view.noAnswerReason || ''))
  return el('div', { role: 'tabpanel', 'data-tab': 'answer' }, parts)
}

function stepLabel(step) {
  if (step.outcome === 'walled') return WALL_TEXT[step.wall.signal] || 'walled'
  if (step.outcome === 'loaded') return step.tool === 'look' ? 'looked' : 'loaded'
  if (step.outcome === 'no_result') return 'no result on the tape'
  return step.outcome
}

/** One read on one line — tool, outcome, host and path, title — with the rest behind it. */
function readRow(step) {
  const line = [
    el('span', { class: 'tool', text: step.tool }),
    el('span', { class: `chip chip-${step.outcome}`, text: stepLabel(step) }),
    step.url ? shortLink(step.url, 'read-url') : el('span', { class: 'muted read-url', text: 'no page' }),
    step.title ? el('span', { class: 'muted read-title', text: step.title, title: step.title }) : null,
  ]
  const requested = step.requested && step.requested !== step.url ? el('div', { class: 'muted small', text: `${step.tool === 'look' ? 'asked' : 'requested'}: ${step.requested}` }) : null
  const error = step.error ? el('div', { class: 'error small', text: step.error }) : null
  if (!step.text && !requested) return el('li', { class: 'read' }, el('div', { class: 'read-line' }, line), error)
  return el(
    'li',
    { class: 'read' },
    el('details', {}, el('summary', { class: 'read-line' }, line), el('div', { class: 'read-detail' }, requested, step.text ? el('pre', { text: step.text }) : null)),
    error,
  )
}

function evidenceRow(entry) {
  const verdict = entry.accepted === true ? ['recorded', 'recorded'] : entry.accepted === false ? ['rejected', 'rejected'] : ['no_result', 'no result']
  return el(
    'li',
    {},
    el('div', { class: 'evidence-head' }, el('span', { class: `chip chip-${verdict[0]}`, text: verdict[1] }), entry.kind ? el('span', { class: 'muted small', text: entry.kind }) : null, shortLink(entry.sourceUrl)),
    entry.observation ? el('div', { text: entry.observation }) : null,
    entry.excerpt ? el('blockquote', { text: entry.excerpt }) : null,
    entry.outcome ? el('div', { class: 'muted small', text: entry.outcome }) : null,
  )
}

function readPanel(view) {
  const parts = []
  if (view.trailNote) parts.push(el('p', { class: 'error', text: view.trailNote }))
  if (!view.trail) {
    if (!view.trailNote) parts.push(el('p', { class: 'muted', text: 'No trail: nothing was dispatched.' }))
    return el('div', { role: 'tabpanel', 'data-tab': 'read' }, parts)
  }
  const trail = view.trail
  if (trail.subagentsSpawned > 0) {
    parts.push(el('p', { class: 'muted small', text: `The Run spawned ${trail.subagentsSpawned} Subagent(s); their own browsing is not on this tape.` }))
  }
  parts.push(trail.steps.length === 0 ? el('p', { class: 'muted', text: 'The Run navigated, read and looked at nothing.' }) : el('ol', { class: 'reads' }, trail.steps.map(readRow)))

  parts.push(el('h3', { text: 'Evidence recorded' }))
  const accepted = trail.evidence.filter((entry) => entry.accepted === true)
  const others = trail.evidence.filter((entry) => entry.accepted !== true)
  if (trail.evidence.length === 0) parts.push(el('p', { class: 'muted small', text: 'None.' }))
  if (accepted.length > 0) parts.push(el('ol', { class: 'evidence' }, accepted.map(evidenceRow)))
  if (others.length > 0) {
    // What the assistant tried to record and could not: for diagnosing the Run, not for judging the Answer.
    const rejected = others.filter((entry) => entry.accepted === false).length
    const noResult = others.length - rejected
    const summary = [rejected > 0 ? `${rejected} rejected` : null, noResult > 0 ? `${noResult} with no result` : null].filter(Boolean).join(' · ')
    parts.push(el('details', { class: 'fold' }, el('summary', { text: summary }), el('ol', { class: 'evidence' }, others.map(evidenceRow))))
  }
  if (view.screenshots.length > 0) {
    parts.push(el('h3', { text: 'Failure screenshots' }), el('ul', {}, view.screenshots.map((shot) => el('li', {}, el('a', { href: shot.href, target: '_blank', rel: 'noopener noreferrer', text: shot.name })))))
  }
  return el('div', { role: 'tabpanel', 'data-tab': 'read' }, parts)
}

function sourcesList(sources) {
  if (!sources || sources.length === 0) return el('p', { class: 'muted small', text: 'None.' })
  return el('ul', {}, sources.map((source) => el('li', {}, link(source.url), el('div', { class: 'muted small', text: source.supports }))))
}

/** The key beyond its checks: the required facts and pitfalls are the checks, so they are not repeated here. */
function keyPanel(view) {
  const key = view.key
  const delta = key.followUpDelta
  return el(
    'div',
    { role: 'tabpanel', 'data-tab': 'key' },

  )
}

// The Grade form: constraints, checks, verdict, support, rationale

function gradePane(view, saveNote) {
  const key = view.key
  const form = el('div', { class: 'grade-form', id: 'grade' })
  if (key.constraints.length > 0) form.append(el('div', { class: 'constraints' }, el('h3', { text: 'Constraints' }), list(key.constraints)))

  if (!current.state) {
    form.append(
      el('p', { class: 'muted', text: 'Nothing to grade: no attempt was dispatched into this slot.' }),
      el('h3', { text: 'The checks this step would have been judged against' }),
      el('ul', {}, view.checks.map((check) => el('li', {}, el('code', { class: 'check-id', text: check.checkId }), ' ', check.description))),
    )
    const bar = el('div', { class: 'save-bar', id: 'save-bar' }, el('div', { class: 'save-row' }, el('span', { class: 'to-save-line muted', id: 'to-save-line', text: 'nothing to grade' })))
    return el('section', { class: 'pane grade-pane' }, el('div', { class: 'pane-scroll' }, form), bar)
  }
  const state = current.state

  const checks = el('ol', { class: 'checks', id: 'checks' })
  const renderChecks = () => checks.replaceChildren(...view.checks.map(checkRow))
  renderChecks()
  const markAll = view.answer

    : el('button', { type: 'button', class: 'quiet', text: 'Mark every check unsatisfied', onclick: () => { for (const check of view.checks) state.checks[check.checkId] = Object.assign({}, state.checks[check.checkId], { satisfied: false }); renderChecks(); changed() } })
  form.append(el('div', { class: 'section-head' }, el('h3', { text: 'Checks' }), el('span', { class: 'muted small', text: String(view.checks.length) }), markAll), checks)

  const verdicts = el(
    'div',
    { class: 'verdicts', role: 'radiogroup', 'aria-label': 'verdict' },
    view.allowedStatuses.map((status) =>
      el(
        'label',
        { class: 'verdict' },
        el('input', { type: 'radio', name: 'verdict', value: status, checked: state.status === status, onchange: () => { state.status = status; changed() } }),
        el('span', {}, el('strong', { text: STATUS_TEXT[status][0] }), el('span', { class: 'muted small verdict-gloss', text: STATUS_TEXT[status][1] })),
      ),
    ),
  )
  // Element.append writes a null as the text "null", so nothing optional goes through it directly.
  form.append(el('h3', { text: 'Verdict' }))
  if (!view.answer) form.append(el('p', { class: 'muted small', text: 'No Answer was published: unsuccessful or help / access blocked only.' }))
  form.append(verdicts)

  const supportRows = el('div', { id: 'support-rows' })
  current.renderSupport = () => supportRows.replaceChildren(...state.support.map(supportRow))
  current.renderSupport()
  form.append(
    el('div', { class: 'section-head' }, el('h3', { text: 'Support' }), el('button', { type: 'button', class: 'quiet', text: 'Add support', onclick: () => { state.support.push({ claim: '', sourceUrl: '', passageRef: '', equivalentTo: '' }); current.supportModes.push('pick'); current.renderSupport(); changed() } })),
    supportRows,
  )

  const rationale = el('textarea', { id: 'rationale', rows: 4, placeholder: 'Why this verdict — required', oninput: (event) => { state.rationale = event.target.value; changed() } })
  rationale.value = state.rationale
  form.append(el('h3', { text: 'Rationale' }), rationale)

  if (view.comparison) form.append(comparisonPanel(view.comparison))

  return el('section', { class: 'pane grade-pane' }, el('div', { class: 'pane-scroll' }, form), saveBar(view, saveNote))
}

function checkRow(check) {
  const state = current.state
  const id = check.checkId
  const judged = state.checks[id]
  const noteBox = el('textarea', {
    rows: 2,
    class: 'note-box',
    placeholder: 'optional note — kept in your grades file, never exported into a report',
    'aria-label': `note on ${id}`,
    hidden: judged.note === '',
    oninput: (event) => {
      state.checks[id] = Object.assign({}, state.checks[id], { note: event.target.value })
      noteButton.classList.toggle('has-note', event.target.value !== '')
      changed()
    },
  })
  noteBox.value = judged.note
  const yes = el('button', { type: 'button', class: 'seg seg-yes', 'data-satisfied': 'true', 'aria-pressed': String(judged.satisfied === true), text: 'satisfied' })
  const no = el('button', { type: 'button', class: 'seg seg-no', 'data-satisfied': 'false', 'aria-pressed': String(judged.satisfied === false), text: 'not satisfied' })
  const set = (satisfied) => {
    state.checks[id] = Object.assign({}, state.checks[id], { satisfied })
    yes.setAttribute('aria-pressed', String(satisfied === true))
    no.setAttribute('aria-pressed', String(satisfied === false))
    changed()
  }
  yes.addEventListener('click', () => set(true))
  no.addEventListener('click', () => set(false))
  const noteButton = el('button', {
    type: 'button',
    class: ['note-toggle', judged.note !== '' ? 'has-note' : ''].join(' '),
    title: 'note',
    'aria-label': `note on ${id}`,
    'aria-expanded': String(judged.note !== ''),
    text: '✎',
    onclick: () => {
      noteBox.hidden = !noteBox.hidden
      noteButton.setAttribute('aria-expanded', String(!noteBox.hidden))
      if (!noteBox.hidden) noteBox.focus()
    },
  })
  return el(
    'li',
    { class: 'check', 'data-check': id },
    el('div', { class: 'check-text' }, el('code', { class: 'check-id', text: id }), check.description),
    el('div', { class: 'check-controls' }, el('div', { class: 'seg-group', role: 'group', 'aria-label': `${id} judgment` }, yes, no), noteButton),
    noteBox,
  )
}

function supportRow(row, index) {
  const picks = current.view.key.pickSources
  const mode = current.supportModes[index]
  const update = (field, value) => { row[field] = value; changed() }
  const text = (field, placeholder) => {
    const input = el('input', { type: 'text', placeholder, oninput: (event) => update(field, event.target.value) })
    input.value = row[field]
    return input
  }
  const pickedIndex = picks.findIndex((pick) => pick.url === row.sourceUrl)
  const select = el(
    'select',
    {
      onchange: (event) => {
        const value = event.target.value
        if (value === 'other') {
          current.supportModes[index] = 'other'
          row.sourceUrl = ''
          row.passageRef = ''
        } else {
          current.supportModes[index] = 'pick'
          const pick = picks[Number(value)]
          row.sourceUrl = pick ? pick.url : ''
          row.passageRef = pick ? pick.passageRef : ''
          row.equivalentTo = ''
        }
        current.renderSupport()
        changed()
      },
    },
    el('option', { value: '', text: 'choose a key source…', selected: mode === 'pick' && pickedIndex === -1 }),
    picks.map((pick, pickIndex) => el('option', { value: String(pickIndex), text: pick.url, selected: mode === 'pick' && pickIndex === pickedIndex })),
    el('option', { value: 'other', text: 'another URL — an equivalent source', selected: mode === 'other' }),
  )
  const parts = [text('claim', 'the claim in the Answer this supports'), select]
  if (mode === 'pick' && pickedIndex !== -1) {
    parts.push(el('div', { class: 'supports muted', text: picks[pickedIndex].supports }), text('passageRef', 'where the passage is — a heading or the key source id'))
  }
  if (mode === 'other') {
    const equivalent = el(
      'select',
      { onchange: (event) => update('equivalentTo', event.target.value) },
      el('option', { value: '', text: 'equivalent to… (none)', selected: row.equivalentTo === '' }),
      picks.map((pick) => el('option', { value: pick.url, text: pick.url, selected: row.equivalentTo === pick.url })),
    )
    parts.push(text('sourceUrl', 'https://… the page you read'), text('passageRef', 'where the passage is on it'), equivalent)
  }
  parts.push(el('div', {}, el('button', { type: 'button', class: 'quiet', text: 'Remove', onclick: () => { current.state.support.splice(index, 1); current.supportModes.splice(index, 1); current.renderSupport(); changed() } })))
  return el('div', { class: 'support-row' }, parts)
}

// ---------------------------------------------------------------------------
// The save bar

function saveBar(view, saveNote) {
  const line = el('span', { class: 'to-save-line', id: 'to-save-line' })
  const checklist = el('ul', { class: 'to-save', id: 'to-save', hidden: true })
  const toggle = el('button', {
    type: 'button',
    class: 'quiet',
    id: 'to-save-toggle',
    'aria-expanded': 'false',
    'aria-controls': 'to-save',
    text: 'checklist',
    onclick: () => {
      checklist.hidden = !checklist.hidden
      toggle.setAttribute('aria-expanded', String(!checklist.hidden))
    },
  })
  const errors = el('ul', { class: 'save-errors', id: 'save-errors', hidden: true })
  const saveButton = el('button', { type: 'button', class: 'primary', id: 'save', disabled: true, text: view.saved ? 'Save changes' : 'Save Grade', onclick: () => void save() })
  // Always present, shown once a draft exists — an edit begun on this screen can be discarded on it.
  const discard = el('button', { type: 'button', id: 'discard', hidden: current.source !== 'draft', text: view.saved ? 'Discard edit' : 'Discard draft', onclick: () => void discardDraft() })
  const note = el('span', { class: 'save-state', id: 'save-state', text: saveNote || (current.source === 'draft' ? 'restored your draft' : current.source === 'saved' ? 'as saved in your grades file' : '') })
  current.ui = { line, checklist, errors, saveButton, discard, note }
  return el(
    'div',
    { class: 'save-bar', id: 'save-bar' },
    checklist,
    errors,
    el('div', { class: 'save-row' }, el('div', { class: 'save-status' }, line, toggle, note), el('div', { class: 'save-buttons' }, discard, saveButton)),
  )
}

/** What is left before a save, as the server worked it out from the validator: work to do, never errors. */
function drawToSave() {
  if (!current || !current.ui || !current.toSave) return
  const { line, checklist, saveButton } = current.ui
  const toSave = current.toSave
  const left = toSave.items.filter((item) => !item.done)
  line.replaceChildren(...(toSave.ready ? [el('span', { class: 'ready', text: 'ready to save' })] : ['left: ', left.map((item) => item.short).join(' · ')]))
  checklist.replaceChildren(...toSave.items.map((item) => el('li', { class: item.done ? 'done' : 'todo' }, el('span', { class: 'mark', 'aria-hidden': 'true', text: item.done ? '✓' : '○' }), item.label)))
  saveButton.disabled = !toSave.ready
}

/** The server's refusal, in its own words, and only after a save or a draft was actually refused. */
function showErrors(messages) {
  if (!current || !current.ui) return
  current.ui.errors.replaceChildren(...messages.map((message) => el('li', { text: message })))
  current.ui.errors.hidden = messages.length === 0
}

function saveState(text) {
  if (current && current.ui) current.ui.note.textContent = text
}

function changed() {
  current.dirty = true
  showErrors([])
  saveState('writing draft…')
  clearTimeout(current.timer)
  current.timer = setTimeout(() => void flushDraft(), 300)
}

/** Write the current draft now, if there is one to write. Every change lands in the sidecar. Resolves false when the last write was refused. */
function flushDraft() {
  if (!current || !current.dirty) return current ? current.inflight : Promise.resolve()
  const target = current
  clearTimeout(target.timer)
  target.dirty = false
  const state = JSON.parse(JSON.stringify(target.state))
  // keepalive lets a draft written as the page closes still land, but the
  // browser refuses a keepalive body over 64 KB — a Grade with long notes.
  const keepalive = JSON.stringify(state).length < 60_000
  target.inflight = target.inflight.then(async () => {
    const { status, data } = await api('PUT', `/api/drafts/${encodeURIComponent(target.attemptId)}`, { state }, { keepalive })
    const written = status === 200
    if (current !== target) return written
    if (written) {
      target.source = 'draft'
      target.ui.discard.hidden = false
      target.toSave = data.toSave
      drawToSave()
      saveState('draft written')
      await refreshSet()
    } else {
      target.ui.saveButton.disabled = true
      showErrors(data.errors || [data.error || `the draft was not written (HTTP ${status})`])
      saveState('the draft was NOT written')
    }
    return written
  })
  return target.inflight
}

async function save() {
  const target = current
  await flushDraft()
  if (current !== target) return
  const { status, data } = await api('POST', `/api/grades/${encodeURIComponent(target.attemptId)}`, { state: target.state })
  if (current !== target) return
  if (status === 200) {
    await refreshSet()
    renderAttempt(data, 'saved to your grades file')
    return
  }
  showErrors(data.errors || [data.error || `not saved (HTTP ${status})`])
  saveState('not saved — your grades file is unchanged')
}

async function discardDraft() {
  const target = current
  clearTimeout(target.timer)
  target.dirty = false
  await target.inflight
  const { status, data } = await api('DELETE', `/api/drafts/${encodeURIComponent(target.attemptId)}`)
  if (status !== 200) {
    showErrors([data.error || `the draft was not discarded (HTTP ${status})`])
    return
  }
  await refreshSet()
  renderAttempt(data, 'draft discarded')
}

// ---------------------------------------------------------------------------
// Another reviewer's Grade: disagreements first

function mark(value) {
  if (value === null) return '—'
  return value ? 'satisfied' : 'not satisfied'
}

function comparisonPanel(comparison) {
  if (comparison.otherPending) {
    return el('section', { class: 'comparison', id: 'comparison' }, el('h3', { text: 'The other Grade' }), el('p', { class: 'muted', text: 'The other reviewer has not graded this slot.' }))
  }
  const who = comparison.reviewer
  const pair = (label, own, other) =>
    el('div', { class: 'pair' }, el('div', {}, label), el('div', { class: 'pair-cols' }, el('div', {}, el('span', { class: 'who', text: 'you' }), own), el('div', {}, el('span', { class: 'who', text: who }), other)))
  const judgment = (view) => (view === null ? el('span', { class: 'muted', text: 'not judged' }) : [mark(view.satisfied), view.note ? el('div', { class: 'muted small', text: view.note }) : null])
  const checkPair = (check) => pair([el('code', { class: 'check-id', text: check.checkId }), check.description], judgment(check.own), judgment(check.other))
  const verdictPair = pair(el('strong', { text: 'verdict' }), STATUS_TEXT[comparison.status.own][0], STATUS_TEXT[comparison.status.other][0])
  const supportList = (rows) => (rows.length === 0 ? el('span', { class: 'muted', text: 'none' }) : el('ul', {}, rows.map((row) => el('li', {}, row.claim, ' — ', link(row.sourceUrl), ` (${row.passageRef})`, row.equivalentTo ? [' equivalent to ', link(row.equivalentTo)] : null))))

  const disagreements = [comparison.status.agree ? null : verdictPair, ...comparison.checks.filter((check) => !check.agree).map(checkPair)].filter(Boolean)
  const agreements = el(
    'div',
    { class: 'agreements', hidden: true },
    comparison.status.agree ? verdictPair : null,
    comparison.checks.filter((check) => check.agree).map(checkPair),
    pair(el('strong', { text: 'support' }), supportList(comparison.support.own), supportList(comparison.support.other)),
  )
  const showText = `show ${comparison.agreements} agreement${comparison.agreements === 1 ? '' : 's'} and support`
  const toggle = el('button', {
    type: 'button',
    class: 'quiet',
    id: 'show-agreements',
    'aria-expanded': 'false',
    text: showText,
    onclick: () => {
      agreements.hidden = !agreements.hidden
      toggle.setAttribute('aria-expanded', String(!agreements.hidden))
      toggle.textContent = agreements.hidden ? showText : 'hide agreements'
    },
  })
  return el(
    'section',
    { class: 'comparison', id: 'comparison' },
    el('h3', { text: `Compared with ${who}` }),
    el('p', { class: 'comparison-summary', text: `${comparison.disagreements} disagree · ${comparison.agreements} agree` }),
    disagreements.length > 0 ? disagreements : el('p', { class: 'muted small', text: 'No disagreements.' }),
    pair(el('strong', { text: 'rationale' }), comparison.rationale.own, comparison.rationale.other),
    toggle,
    agreements,
  )
}

// ---------------------------------------------------------------------------

/**
 * Back to the setup page in the same process. The draft on screen is written
 * first, so re-entering the set restores it — and a draft that could not be
 * written keeps the reviewer here, with the reason, rather than lost.
 */
async function changeSet(event) {
  event.preventDefault()
  if ((await flushDraft()) === false) return
  const { status, data } = await api('POST', '/api/change-set', {})
  if (status !== 200) {
    document.getElementById('main').replaceChildren(el('p', { class: 'error', text: data.error || `the set could not be left (HTTP ${status})` }))
    return
  }
  location.assign('/')
}

document.getElementById('change-set').addEventListener('click', (event) => void changeSet(event))
window.addEventListener('hashchange', () => void openFromHash())
window.addEventListener('pagehide', () => void flushDraft())
refreshSet().then((loaded) => {
  if (loaded) return openFromHash()
})
</script>
</body>
</html>
