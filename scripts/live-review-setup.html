<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grading Bench · setup</title>
<link rel="icon" href="data:,">
<!--
  The Grading Bench's setup page (#229, #230, #232), served by
  scripts/live-review.ts on loopback before the bench opens. The bench
  proposes — every capture set in the artifacts root, the grades file your
  work goes into, another reviewer's Grade to compare against, the key — and
  you confirm with Start. Nothing is opened, and nothing is written, before
  that. What each choice means is in docs/live-web-reporting.md; the page
  carries labels, not lessons.

  Plain DOM, no framework, no network beyond its own server. Every string
  from a capture set or a grades file goes in through textContent.
-->
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e6e6e0;
    --accent: #2f5bd3; --ok: #1f7a3a; --warn: #9a6200; --bad: #b3261e; --soft: #eef1fb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecece8; --muted: #9c9c95; --line: #2e2e2a;
      --accent: #8aa8ff; --ok: #6fcf8a; --warn: #e6b450; --bad: #ff8a80; --soft: #232a3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  code { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .top { display: flex; gap: 10px; align-items: baseline; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 20px 48px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 14px; }
  input[type="text"] { font: inherit; width: 100%; max-width: 360px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; }
  .reviewer-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .reviewer-row p { margin: 0; }
  #caution { margin: 8px 0 0; }
  .sets, .comparisons { list-style: none; padding: 0; margin: 0; }
  .set label, .comparisons label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 8px; padding: 8px; cursor: pointer; border-radius: 8px; }
  .set + .set, .comparisons li + li { margin-top: 2px; }
  .set.chosen label, .comparisons .chosen label { background: var(--soft); }
  .set.refused label { cursor: not-allowed; }
  .set.refused .set-line { opacity: .55; }
  .set-line { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .set-line strong, .comparisons strong { overflow-wrap: anywhere; }
  .set-progress, .set-files, .reasons { grid-column: 2; }
  .reasons { margin: 2px 0 0; padding-left: 18px; color: var(--bad); font-size: 12.5px; }
  .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 18px 0 6px; }
  .actions button { font: inherit; font-weight: 600; padding: 7px 22px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .actions button:disabled { opacity: .45; cursor: not-allowed; }
  .start-errors { margin: 6px 0 0; padding-left: 18px; color: var(--bad); }
  .footer { margin-top: 28px; }
  .footer p { margin: 2px 0; }
</style>
</head>
<body>
<header class="top">
  <h1>Grading Bench</h1>
  <span class="muted">setup</span>
</header>
<main>
  <section class="panel">
    <h2>Reviewer</h2>
    <div class="reviewer-row">
      <input type="text" id="reviewer" autocomplete="off" spellcheck="false" aria-describedby="reviewer-note">
      <p class="muted small" id="reviewer-note"></p>
    </div>
    <p class="muted small" id="caution" hidden></p>
  </section>

  <section class="panel">
    <h2>Capture set</h2>
    <ol class="sets" id="sets"><li class="muted">Reading the artifacts root…</li></ol>
    <p class="muted small" id="nothing" hidden>
      Nothing here is left to grade. A measured pass is run with
      <code>BINGBONG_ENV_FILE=/absolute/path/to/.env pnpm test:live</code>;
      <code>docs/live-web-pilot-runbook.md</code> walks through it.
    </p>
  </section>

  <section class="panel">
    <h2>Compare against</h2>
    <ol class="comparisons" id="comparisons"><li class="muted">choose a set</li></ol>
  </section>

  <div class="actions">
    <button type="button" id="start" disabled>Start</button>
    <span class="muted" id="start-note"></span>
  </div>
  <ul class="start-errors" id="start-errors" hidden></ul>

  <div class="footer muted small">
    <p id="key-line"></p>
    <p id="roots-line"></p>
  </div>
</main>
<script>
'use strict'

// ---------------------------------------------------------------------------
// Small DOM helpers. Text always goes in as text.

function el(tag, attrs, ...children) {
  const node = document.createElement(tag)
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue
    if (name === 'class') node.className = value
    else if (name === 'text') node.textContent = value
    else if (name.startsWith('on')) node.addEventListener(name.slice(2), value)
    else if (value === true) node.setAttribute(name, '')
    else node.setAttribute(name, String(value))
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue
    node.append(typeof child === 'string' ? document.createTextNode(child) : child)
  }
  return node
}

async function api(method, path, body) {
  const init = { method, headers: {} }
  if (body !== undefined) {
    init.headers['content-type'] = 'application/json'
    init.body = JSON.stringify(body)
  }
  const response = await fetch(path, init)
  let data = null
  try {
    data = await response.json()
  } catch (error) {
    data = { error: `the server sent no JSON (${String(error)})` }
  }
  return { status: response.status, data }
}

const $ = (id) => document.getElementById(id)

// ---------------------------------------------------------------------------
// State

/** The server's last proposal, for the name in the reviewer field. */
let view = null
/** The set file chosen; the server's preselection until the reviewer picks one. */
let chosen = null
let pickedByHand = false
/** Only the newest proposal is drawn — the field changes faster than the server answers. */
let proposals = 0
/** False while the reviewer field has changed and its proposal is not back: Start waits for it. */
let answered = false
let timer = null
/** The comparison chosen, by file, or null for none: the set's proposal until the reviewer picks, and again when the set changes. */
let comparison = null
let comparisonByHand = false
/** The set the comparison was settled for. */
let comparisonSetFile = null

function chosenSet() {
  return view && chosen ? view.sets.find((set) => set.file === chosen) || null : null
}

/** Keep a comparison picked by hand while its set is chosen and the file is still offered; otherwise take the set's proposal. */
function settleComparison(set) {
  const offered = set ? set.comparisons : []
  const kept = comparisonByHand && comparisonSetFile === (set && set.file) && (comparison === null || offered.some((candidate) => candidate.file === comparison))
  if (!kept) {
    comparison = set ? set.preselectedComparison : null
    comparisonByHand = false
  }
  comparisonSetFile = set ? set.file : null
}

// ---------------------------------------------------------------------------
// Rendering

function progressText(progress) {
  const parts = [`${progress.graded} graded`, `${progress.drafted} drafted`, `${progress.pending} pending`]
  if (progress.notReached > 0) parts.push(`${progress.notReached} not reached`)
  return parts.join(' · ')
}

function created(iso) {
  if (!iso) return null
  const date = new Date(iso)
  return Number.isNaN(date.getTime()) ? iso : date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
}

/** A digest short enough to glance at: its algorithm, the first and last few hex digits. */
function shortDigest(digest) {
  const match = /^([a-z0-9]+):([0-9a-f]{16,})$/.exec(digest || '')
  return match ? `${match[1]}:${match[2].slice(0, 6)}…${match[2].slice(-6)}` : digest || '—'
}

function reviewerNote(reviewer) {
  if (view.reviewerFixed) return 'fixed for this process; restart live:review to grade as someone else'
  if (reviewer === '') return 'name a reviewer to start'
  if (view.defaultReviewer !== null && reviewer === view.defaultReviewer) return 'from git config user.name; fixed at the first Start'
  return 'fixed at the first Start'
}

/** The chosen set's files, in one line under it. */
function filesLine(set, reviewer) {
  if (set.gradesFile) {
    return el(
      'span',
      { class: 'set-files muted small' },
      'files: ',
      el('code', { text: set.gradesFile.name }),
      set.gradesFile.resumed ? ' (your work there is reopened)' : ' (new)',
      ', drafts beside it',
    )
  }
  if (reviewer === '') return el('span', { class: 'set-files muted small', text: 'files: name a reviewer first — the grades file is named for them' })
  return null
}

function render() {
  const reviewer = $('reviewer').value.trim()
  $('reviewer').readOnly = view.reviewerFixed
  $('reviewer-note').textContent = reviewerNote(reviewer)
  $('caution').hidden = !view.caution
  $('caution').textContent = view.caution || ''

  const keyLine = $('key-line')
  keyLine.replaceChildren('key ', el('code', { text: view.key.version }), ' · ', el('code', { text: shortDigest(view.key.digest), title: view.key.digest }))
  $('roots-line').textContent = `capture sets from ${view.roots.artifacts} · grades filed in ${view.roots.private}`

  const startable = view.sets.filter((set) => set.refusals.length === 0)
  $('nothing').hidden = !(startable.length === 0 || (answered && reviewer !== '' && view.preselected === null))
  const sets = $('sets')
  if (view.sets.length === 0) {
    sets.replaceChildren(el('li', { class: 'muted', text: 'No capture sets.' }))
  } else {
    sets.replaceChildren(
      ...view.sets.map((set) => {
        const refused = set.refusals.length > 0
        const isChosen = set.file === chosen
        const radio = el('input', {
          type: 'radio',
          name: 'set',
          value: set.file,
          checked: isChosen,
          disabled: refused,
          onchange: () => {
            chosen = set.file
            pickedByHand = true
            render()
          },
        })
        const facts = [set.slots === null ? null : `${set.slots} slots`, created(set.createdAt)].filter(Boolean).join(' · ')
        return el(
          'li',
          { class: ['set', refused ? 'refused' : '', isChosen ? 'chosen' : ''].join(' ') },
          el(
            'label',
            { title: [set.file, set.mode, set.state].filter(Boolean).join(' · ') },
            radio,
            el(
              'span',
              { class: 'set-line' },
              el('strong', { text: set.setId || set.file }),
              set.file === view.preselected ? el('span', { class: 'chip', text: 'proposed' }) : null,
              facts ? el('span', { class: 'muted small', text: facts }) : null,
            ),
            set.progress ? el('span', { class: 'set-progress small', text: progressText(set.progress) }) : null,
            isChosen && !refused ? filesLine(set, reviewer) : null,
            refused ? el('ul', { class: 'reasons' }, set.refusals.map((reason) => el('li', { text: reason }))) : null,
          ),
        )
      }),
    )
  }

  const set = chosenSet()
  const file = set && set.gradesFile
  settleComparison(set)
  const offered = file ? set.comparisons : []
  const comparisonOption = (value, label, note) =>
    el(
      'li',
      { class: comparison === value ? 'chosen' : '' },
      el(
        'label',
        {},
        el('input', {
          type: 'radio',
          name: 'comparison',
          value: value === null ? '' : value,
          checked: comparison === value,
          onchange: () => {
            comparison = value
            comparisonByHand = true
            render()
          },
        }),
        el('span', { class: 'set-line' }, el('strong', { text: label }), note ? el('span', { class: 'muted small', text: note }) : null),
      ),
    )
  if (file) {
    $('comparisons').replaceChildren(
      comparisonOption(null, 'none', offered.length === 0 ? 'no other reviewer’s grades for this set' : null),
      ...offered.map((candidate) => comparisonOption(candidate.file, candidate.reviewer, candidate.file)),
    )
  } else {
    $('comparisons').replaceChildren(el('li', { class: 'muted', text: set ? 'none — this set cannot be started' : 'choose a set' }))
  }
  const beside = offered.find((candidate) => candidate.file === comparison)

  const ready = answered && reviewer !== '' && set !== null && set.gradesFile !== null
  $('start').disabled = !ready
  $('start-note').textContent = ready
    ? `grade ${set.setId} as ${reviewer}${beside ? `, compared with ${beside.reviewer}` : ''}`
    : !answered && reviewer !== ''
      ? 'checking what this name would open…'
      : ''
}

// ---------------------------------------------------------------------------
// Asking the server

/** Ask what the bench proposes for a name — or, with none, for the one git names, which then fills the field. */
async function propose(reviewer) {
  const proposal = ++proposals
  const { status, data } = await api('GET', reviewer === undefined ? '/api/setup' : `/api/setup?reviewer=${encodeURIComponent(reviewer)}`)
  if (proposal !== proposals) return
  if (status !== 200) {
    $('sets').replaceChildren(el('li', { class: 'start-errors', text: data.error || `the setup could not be read (HTTP ${status})` }))
    return
  }
  if (data.started) {
    location.replace('/')
    return
  }
  // With no name asked, or once the first Start has fixed it, the field shows the server's.
  if (reviewer === undefined || data.reviewerFixed) $('reviewer').value = data.reviewer
  view = data
  answered = true
  const picked = chosenSet()
  if (!pickedByHand || picked === null) {
    chosen = view.preselected
    pickedByHand = false
  }
  render()
}

function showStartErrors(errors) {
  const list = $('start-errors')
  list.replaceChildren(...errors.map((error) => el('li', { text: error })))
  list.hidden = errors.length === 0
}

async function start() {
  const set = chosenSet()
  $('start').disabled = true
  showStartErrors([])
  // The grades file and the comparison go with Start, so the server opens only what this page showed.
  const { status, data } = await api('POST', '/api/start', { file: set.file, reviewer: $('reviewer').value, gradesFile: set.gradesFile.name, comparisonFile: comparison })
  if (status === 200) {
    location.replace('/')
    return
  }
  showStartErrors(data.errors || [data.error || `the bench did not open (HTTP ${status})`])
  await propose($('reviewer').value)
}

$('reviewer').addEventListener('input', () => {
  showStartErrors([])
  // Whatever is on its way back answers an older name.
  proposals += 1
  answered = false
  clearTimeout(timer)
  timer = setTimeout(() => void propose($('reviewer').value), 250)
  if (view) render()
})
$('start').addEventListener('click', () => void start())

void propose()
</script>
</body>
</html>
